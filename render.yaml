databases:
  - name: talk-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"

services:
  - type: web
    name: talk-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm run render:build
    startCommand: npm run start
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: NODE_ENV
        value: production
      # Survives deploys/restarts — not wiped like local SQLite on free web disk.
      - key: DATABASE_URL
        fromDatabase:
          name: talk-db
          property: connectionString
      # Phase 6 live TTL — delete media older than 14d with full ACK.
      - key: MEDIA_TTL_PURGE_ENABLED
        value: "true"
      - key: MEDIA_TTL_PURGE_DRY_RUN
        value: "false"
      - key: MEDIA_TTL_DAYS
        value: "14"
